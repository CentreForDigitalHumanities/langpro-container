ErrorLog /dev/stdout
ScriptLog /dev/stdout

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "/langpro"


    CustomLog /dev/stdout combined
    <Directory /langpro>
        Options +Indexes +ExecCGI
        AllowOverride None
        Require all granted
        AddHandler cgi-script .cgi
    </Directory>

    TimeOut 600

    <Location /api>
        ProxyPass http://localhost:5000/

    </Location>
</VirtualHost>