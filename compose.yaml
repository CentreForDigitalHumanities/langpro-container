version: "3"

services:
  langpro:
    container_name: langpro
    build: .
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8080:80"
    volumes:
      - ./LangPro_demo:/langpro
      - ../LangPro:/git_LangPro
    environment:
      PYTHONPATH: /git_LangPro/python
    command: "bash /langpro/start.sh"
