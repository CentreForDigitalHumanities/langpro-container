<!DOCTYPE html>
<html>
<head>
<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
<script>

function toggle_block()
{
    var elem=document.getElementById("listRefs");
	elem.toggle();
};

</script>
</head>
<body>

<p id="listRefs">This is a paragraph.</p>

<button onclick="toggle_block()">Toggle between hide() and show()</button>

</body>
</html>
